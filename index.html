<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insights Hub — dashboard and report designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B1B1F; --paper:#FAFAF9; --surface:#FFFFFF; --rule:#E7E6EB;
  --cyan:#6D3FD5; --muted:#6E6D77; --faint:#9A99A4;
  --behind:#D45D79; --ahead:#D39A35; --onplan:#38AD9D; --blocked:#7853D6;
  --lavender:#E9E5FF; --lavender-deep:#4D28B8; --mint:#DDF7F2;
  --butter:#FFF7D6; --bluewash:#E7F1FF;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(760px 360px at 46% 0%, rgba(231,225,255,.68), transparent 72%),
    radial-gradient(560px 300px at 70% 16%, rgba(221,247,242,.48), transparent 72%),
    radial-gradient(460px 280px at 100% 8%, rgba(255,247,214,.48), transparent 74%),
    var(--paper); color:var(--ink);
  font-family:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-weight:400; font-size:15px; line-height:1.5;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums}
a{color:var(--cyan)}

/* ---------- shell ---------- */
.shell{display:flex; min-height:100vh; align-items:stretch}
.rail{
  width:216px; flex:0 0 216px; background:rgba(255,255,255,.96); color:var(--ink);
  border-right:1px solid #EFEEF2;
  padding:26px 0 20px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{padding:0 22px 24px; border-bottom:1px solid #EFEEF2}
.brand .mark{font-size:19px; font-weight:600; letter-spacing:-.01em; line-height:1.2}
.brand .mark{color:var(--cyan)}
.brand .sub{font-size:12.5px; color:#A09FA9; margin-top:4px}
.nav{padding:14px 10px 0}
.nav button{
  display:block; width:100%; text-align:left; background:none; border:0; color:#4E4D56;
  font:inherit; font-size:14.5px; padding:9px 12px; border-radius:6px; cursor:pointer;
}
.nav button:hover{background:#F7F5FF; color:var(--ink)}
.nav button[aria-current="true"]{background:var(--lavender); color:var(--lavender-deep); font-weight:500}
.nav button:focus-visible{outline:2px solid var(--cyan); outline-offset:1px}
.nav .navnote{font-size:11.5px; color:#A09FA9; padding:4px 12px 12px; line-height:1.35}
.railfoot{padding:18px 22px 0; margin-top:18px; border-top:1px solid #EFEEF2;
  font-size:11.5px; color:#A09FA9; line-height:1.5}

.main{flex:1 1 auto; min-width:0; padding:30px 34px 64px; max-width:1240px}
.view[hidden]{display:none}

/* ---------- headings ---------- */
h1{font-size:27px; font-weight:600; letter-spacing:-.015em; margin:0 0 6px}
h2{font-size:17px; font-weight:600; margin:0 0 3px; letter-spacing:-.005em}
h3{font-size:13.5px; font-weight:600; margin:0 0 8px}
.lede{color:var(--muted); font-size:15px; max-width:74ch; margin:0 0 22px}
.stamp{font-size:12.5px; color:var(--faint); margin:0 0 20px}
.stamp b{font-weight:500; color:var(--muted)}
.sec{margin:34px 0 0}
.sec > header{margin-bottom:12px}
.sec > header p{margin:0; color:var(--muted); font-size:13.5px; max-width:78ch}

/* ---------- cards ---------- */
.card{background:rgba(255,255,255,.92); border:1px solid rgba(109,63,213,.13); border-radius:8px; padding:18px 20px}
.grid{display:grid; gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}

/* ---------- stat ---------- */
.stat .k{font-size:12.5px; color:var(--muted); margin-bottom:2px}
.stat .v{font-size:29px; font-weight:600; letter-spacing:-.02em; line-height:1.12}
.stat .n{font-size:12.5px; color:var(--faint); margin-top:3px}
.stat .v.behind{color:var(--behind)} .stat .v.ahead{color:var(--ahead)}

/* ---------- the gap strip (hero) ---------- */
.striphead{display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap;
  margin-bottom:10px}
.strip{
  position:relative; display:flex; align-items:stretch; gap:1px; height:152px;
  padding:0; background:
    linear-gradient(to bottom, transparent calc(50% - .5px), var(--rule) calc(50% - .5px),
    var(--rule) calc(50% + .5px), transparent calc(50% + .5px));
}
.strip .col{flex:1 1 0; min-width:0; display:flex; flex-direction:column}
.strip .up,.strip .dn{flex:1 1 50%; display:flex}
.strip .up{align-items:flex-end}
.strip .dn{align-items:flex-start}
.strip .bar{width:100%; border-radius:1px}
.strip .bar.behind{background:var(--behind)}
.strip .bar.ahead{background:var(--ahead)}
.strip .bar.onplan{background:#C7EFE8}
.strip .bar.notlive{background:var(--blocked)}
.stripaxis{display:flex; justify-content:space-between; font-size:12px; color:var(--faint); margin-top:8px}
.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.dot{width:9px; height:9px; border-radius:2px; display:inline-block}

/* ---------- alert ledger ---------- */
.ledger{display:grid; gap:10px; grid-template-columns:repeat(2,1fr)}
.alert{
  background:var(--surface); border:1px solid var(--rule); border-radius:8px;
  padding:14px 16px; display:flex; gap:14px; align-items:flex-start;
}
.alert .cnt{
  flex:0 0 62px; font-size:24px; font-weight:600; line-height:1.1; letter-spacing:-.02em;
}
.alert .cnt small{display:block; font-size:11.5px; font-weight:400; color:var(--faint);
  letter-spacing:0; margin-top:2px}
.alert .body{flex:1 1 auto; min-width:0}
.alert .name{font-size:14.5px; font-weight:600; margin-bottom:3px}
.alert .rule{font-size:12.5px; color:var(--muted); line-height:1.42}
.alert .flag{font-size:12px; color:var(--behind); margin-top:6px; line-height:1.4}
.alert.high .cnt{color:var(--behind)}
.alert.medium .cnt{color:var(--ahead)}
.alert.low .cnt{color:var(--muted)}
.alert.clear .cnt{color:var(--onplan)}
.groupbar{display:flex; align-items:center; gap:10px; margin:22px 0 10px}
.groupbar h3{margin:0}
.groupbar .line{flex:1 1 auto; height:1px; background:var(--rule)}

/* ---------- tables ---------- */
.tablewrap{background:rgba(255,255,255,.94); border:1px solid rgba(109,63,213,.13); border-radius:8px; overflow:auto}
table{width:100%; border-collapse:collapse; font-size:13.5px}
th,td{padding:9px 12px; text-align:left; border-bottom:1px solid var(--rule); vertical-align:middle}
th{font-size:12px; font-weight:600; color:var(--muted); background:#FAF9FF; position:sticky; top:0;
  white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FBFAFF}
td.r,th.r{text-align:right}
.tname{font-weight:500}
.tsub{font-size:12px; color:var(--faint)}
.pill{display:inline-block; font-size:11.5px; font-weight:500; padding:2px 7px; border-radius:10px;
  white-space:nowrap}
.pill.behind{background:#FCE8EE; color:var(--behind)}
.pill.ahead{background:#FFF3D8; color:#A87517}
.pill.onplan{background:#DFF7F2; color:#268C80}
.pill.notlive{background:#EFEAFF; color:var(--blocked)}
.pill.below{background:#FCE8EE; color:var(--behind)}
.pill.within{background:#F1F1F4; color:var(--muted)}
.pill.above{background:#DFF7F2; color:#268C80}

/* pacing mini bar */
.mini{position:relative; width:130px; height:14px; background:#F0F0F3; border-radius:2px}
.mini .fill{position:absolute; left:0; top:0; bottom:0; border-radius:2px; background:#C7EFE8}
.mini .fill.behind{background:var(--behind)}
.mini .fill.ahead{background:var(--ahead)}
.mini .fill.onplan{background:var(--onplan)}
.mini .fill.notlive{background:var(--blocked)}
.mini .tick{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink)}

/* range band for creative */
.band{position:relative; width:180px; height:16px}
.band .track{position:absolute; left:0; right:0; top:7px; height:2px; background:#E8E7ED}
.band .zone{position:absolute; top:3px; height:10px; background:#E9E5FF; border-radius:2px}
.band .med{position:absolute; top:1px; height:14px; width:2px; background:var(--muted)}
.band .act{position:absolute; top:0; height:16px; width:3px; border-radius:2px; background:var(--ink)}
.band .act.below{background:var(--behind)} .band .act.above{background:var(--onplan)}

/* stacked state bar */
.stack{display:flex; height:14px; border-radius:2px; overflow:hidden; min-width:150px; background:#F0F0F3}
.stack i{display:block; height:100%}

/* filters */
.filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.filters button{
  font:inherit; font-size:12.5px; padding:5px 11px; border-radius:14px; cursor:pointer;
  border:1px solid var(--rule); background:var(--surface); color:var(--muted);
}
.filters button[aria-pressed="true"]{background:var(--lavender); border-color:#D8D0FF; color:var(--lavender-deep)}
.filters button:focus-visible{outline:2px solid var(--cyan); outline-offset:1px}

/* coverage bars */
.cov{display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:center; font-size:13px}
.covbar{height:8px; background:#F0F0F3; border-radius:2px; overflow:hidden}
.covbar i{display:block; height:100%; background:var(--cyan)}
.covbar i.part{background:var(--ahead)}
.covbar i.poor{background:var(--behind)}

/* report catalogue */
.note{
  background:#FAF9FF; border:1px solid rgba(109,63,213,.13); border-left:3px solid var(--cyan);
  border-radius:6px; padding:13px 16px; font-size:13.5px; color:var(--muted); line-height:1.5;
}
.note b{color:var(--ink); font-weight:600}
.email{background:rgba(255,255,255,.94); border:1px solid rgba(109,63,213,.13); border-radius:8px; overflow:hidden}
.email .hd{padding:14px 18px; border-bottom:1px solid var(--rule); background:#FAF9FF}
.email .hd .subj{font-weight:600; font-size:14.5px}
.email .hd .meta{font-size:12.5px; color:var(--faint); margin-top:3px}
.email .bd{padding:18px}
.email .bd p{margin:0 0 12px; font-size:13.5px; line-height:1.55; max-width:72ch}
.email ul{margin:0 0 14px; padding-left:20px; font-size:13.5px; line-height:1.6}
.email li{margin-bottom:5px}

/* ---------- performance intelligence ---------- */
.perf-hero{
  background:
    radial-gradient(260px 180px at 100% 0%, rgba(255,247,214,.72), transparent 76%),
    linear-gradient(135deg, rgba(233,229,255,.78), rgba(221,247,242,.68));
  border:1px solid rgba(109,63,213,.16); border-radius:10px; padding:22px 24px;
}
.perf-hero-grid{display:grid; grid-template-columns:minmax(0,1fr) 220px; gap:20px; align-items:center}
.perf-eyebrow{font-size:11.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
  color:var(--lavender-deep); margin-bottom:7px}
.perf-hero h2{font-size:24px; line-height:1.15; letter-spacing:-.02em; margin:0 0 8px}
.perf-hero p{font-size:13.5px; color:var(--muted); max-width:66ch; margin:0; line-height:1.55}
.perf-tags{display:flex; flex-wrap:wrap; gap:7px; margin-top:15px}
.perf-tag{font-size:11.5px; color:var(--lavender-deep); background:rgba(255,255,255,.68);
  border:1px solid rgba(109,63,213,.16); border-radius:14px; padding:4px 9px}
.perf-score{display:flex; flex-direction:column; align-items:center; gap:8px}
.perf-donut{width:156px; height:156px; border-radius:50%; display:grid; place-items:center}
.perf-donut .center{width:108px; height:108px; border-radius:50%; display:flex; flex-direction:column;
  justify-content:center; align-items:center; background:rgba(255,255,255,.92); text-align:center}
.perf-donut .center strong{font-size:28px; line-height:1; letter-spacing:-.03em}
.perf-donut .center span{font-size:11.5px; color:var(--muted); margin-top:5px}
.perf-legend{display:flex; flex-wrap:wrap; justify-content:center; gap:7px 12px; font-size:11.5px; color:var(--muted)}
.perf-legend span{display:inline-flex; align-items:center; gap:5px}
.perf-legend i{width:8px; height:8px; border-radius:50%; display:inline-block}
.perf-legend .below i{background:var(--behind)}
.perf-legend .within i{background:var(--muted)}
.perf-legend .above i{background:var(--onplan)}
.perf-stat{min-height:100px}
.perf-stat .v{font-size:25px}
.perf-kpi-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.perf-kpi{background:rgba(255,255,255,.92); border:1px solid var(--rule); border-radius:8px; padding:15px 16px}
.perf-kpi .product{font-size:14px; font-weight:600; line-height:1.3}
.perf-kpi .goal{font-size:12px; color:var(--faint); margin-top:3px}
.perf-kpi .kpirow{display:grid; grid-template-columns:auto 1fr; gap:5px 10px; margin-top:13px; font-size:12.5px}
.perf-kpi .kpirow b{font-size:11px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em}
.perf-kpi .primary{color:var(--lavender-deep); font-weight:600}
.perf-kpi .secondary{color:var(--ink)}
.perf-kpi .note{margin-top:13px; padding:8px 10px; font-size:12px; line-height:1.4; border-left-width:2px}
.perf-table td{vertical-align:top}
.perf-table .kpi{font-weight:600; color:var(--lavender-deep); white-space:nowrap}
.perf-table .muted{color:var(--faint)}
.perf-signal-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.perf-signal{background:rgba(255,255,255,.92); border:1px solid rgba(109,63,213,.13); border-radius:8px;
  padding:16px 17px; min-height:170px}
.perf-signal .label{font-size:11.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--lavender-deep)}
.perf-signal h3{font-size:18px; line-height:1.2; margin:10px 0 7px; letter-spacing:-.01em}
.perf-signal p{font-size:13px; color:var(--muted); line-height:1.5; margin:0}
.perf-signal .foot{font-size:11.5px; color:var(--faint); margin-top:12px}
.perf-action-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.perf-action{background:rgba(255,255,255,.92); border:1px solid var(--rule); border-radius:8px; padding:17px 18px}
.perf-action.active{border-top:3px solid var(--cyan)}
.perf-action.complete{border-top:3px solid var(--ahead)}
.perf-action .tag{font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.perf-action h3{font-size:16px; margin:8px 0 6px}
.perf-action p{font-size:13.5px; color:var(--muted); line-height:1.55; margin:0}
.perf-ready{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.perf-ready-list{display:grid; gap:11px}
.perf-ready-row{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; font-size:13px}
.perf-ready-row .detail{font-size:12px; color:var(--faint); margin-top:2px}
.perf-ready-row .pct{font-size:12px; color:var(--muted); white-space:nowrap}
.perf-ready-row .covbar{grid-column:1 / -1; margin-top:-6px}
.perf-guardrails{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.perf-guardrail{background:#FAF9FF; border:1px solid rgba(109,63,213,.13); border-radius:8px; padding:15px 16px}
.perf-guardrail h3{margin-bottom:6px}
.perf-guardrail p{font-size:13px; color:var(--muted); line-height:1.5; margin:0}

/* ---------- performance work screen ---------- */
.perf-controls{display:flex; align-items:stretch; gap:8px; flex-wrap:wrap; margin:18px 0 14px}
.perf-control{min-width:150px; background:rgba(255,255,255,.88); border:1px solid var(--rule);
  border-radius:6px; padding:7px 11px}
.perf-control .label{display:block; font-size:10.5px; color:var(--faint); text-transform:uppercase;
  letter-spacing:.06em; margin-bottom:1px}
.perf-control .value{font-size:13px; font-weight:500}
.perf-control .value::after{content:'⌄'; color:var(--faint); margin-left:10px}
.perf-sort-control{padding-right:9px}
.perf-sort-control select{display:block; width:100%; border:0; background:transparent; color:var(--ink);
  font:inherit; font-size:13px; font-weight:500; padding:0 18px 0 0; cursor:pointer; outline:0}
.perf-refresh{margin-left:auto; align-self:center; font-size:12px; color:var(--muted)}
.perf-summary-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
.perf-summary-grid .stat{min-height:94px}
.perf-summary-grid .stat .v{font-size:25px}
.perf-workspace{display:grid; grid-template-columns:minmax(0,1fr) 310px; gap:14px; align-items:start}
.perf-panel{background:rgba(255,255,255,.92); border:1px solid rgba(109,63,213,.13); border-radius:8px; overflow:hidden}
.perf-panel-head{display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding:17px 18px 13px}
.perf-panel-head h2{margin-bottom:3px}
.perf-panel-head p{font-size:13px; color:var(--muted); margin:0; line-height:1.45}
.perf-viewtag{font-size:11.5px; color:var(--lavender-deep); background:var(--lavender); border-radius:12px; padding:3px 8px; white-space:nowrap}
.perf-panel .tablewrap{border:0; border-radius:0}
.perf-table-screen{font-size:12.5px}
.perf-table-screen{min-width:1060px}
.perf-table-screen th{font-size:11.5px}
.perf-table-screen td,.perf-table-screen th{padding:10px 11px}
.perf-table-screen td:nth-child(1){min-width:185px}
.perf-table-screen td:nth-child(3){min-width:150px}
.perf-table-screen td:nth-child(4){min-width:132px}
.perf-table-screen td:nth-child(7){min-width:135px}
.perf-table-screen tbody tr{cursor:pointer; transition:background .15s ease, box-shadow .15s ease}
.perf-table-screen tbody tr[aria-selected="true"]{background:#FBFAFF; box-shadow:inset 3px 0 var(--cyan)}
.perf-table-screen tbody tr:focus-visible{outline:2px solid var(--cyan); outline-offset:-2px}
.perf-kpi-label{font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.04em; text-transform:uppercase}
.perf-result{font-size:14px; font-weight:600; white-space:nowrap}
.perf-result.below{color:var(--behind)} .perf-result.above{color:var(--onplan)}
.perf-benchmark{font-size:12px; color:var(--muted); white-space:nowrap}
.perf-action-text{font-size:12px; line-height:1.35; color:var(--muted)}
.perf-owner{display:grid; gap:5px; min-width:150px}
.perf-owner-line{display:flex; align-items:center; gap:6px; font-size:11.5px; line-height:1.2; white-space:nowrap}
.perf-owner-role{display:inline-flex; align-items:center; justify-content:center; min-width:25px; padding:2px 5px;
  border-radius:5px; font-size:9.5px; font-weight:600; letter-spacing:.03em}
.perf-owner-role.am{background:var(--lavender); color:var(--lavender-deep)}
.perf-owner-role.cm{background:var(--mint); color:#268C80}
.perf-support{display:grid; gap:4px; white-space:nowrap}
.perf-support-line{display:flex; align-items:baseline; gap:6px}
.perf-support-line b{font-size:10px; color:var(--faint); text-transform:uppercase; letter-spacing:.04em; font-weight:600}
.perf-support-line span{font-size:12.5px; color:var(--ink); font-weight:500}
.perf-delivery{font-size:12px; font-weight:500; white-space:nowrap}
.perf-delivery.missing{color:var(--faint); font-weight:400}
.perf-delivery-note{font-size:10.5px; line-height:1.3; color:var(--faint); margin-top:3px; max-width:125px}
.perf-detail-metrics{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px}
.perf-detail-metric{background:rgba(255,255,255,.72); border:1px solid rgba(109,63,213,.12); border-radius:6px; padding:9px 10px}
.perf-detail-metric .k{font-size:10px; color:var(--faint); text-transform:uppercase; letter-spacing:.04em}
.perf-detail-metric .v{font-size:15px; font-weight:600; line-height:1.15; margin-top:3px}
.perf-detail-metric .v.missing{font-size:12px; color:var(--faint); font-weight:500}
.perf-detail-metric .n{font-size:10.5px; color:var(--muted); line-height:1.25; margin-top:3px}
.perf-impact{font-size:11.5px; color:var(--muted); line-height:1.35; margin-top:9px}
.perf-impact strong{font-weight:600; color:var(--ink)}
.perf-data-note{display:flex; align-items:flex-start; gap:8px; margin-top:12px; padding:10px 12px;
  background:#FAF9FF; border:1px solid rgba(109,63,213,.12); border-radius:6px; color:var(--muted);
  font-size:11.5px; line-height:1.4}
.perf-data-note .mark{color:var(--cyan); font-size:14px; line-height:1.1}
.perf-detail{background:linear-gradient(160deg,rgba(233,229,255,.74),rgba(255,255,255,.94));
  border:1px solid rgba(109,63,213,.16); border-radius:8px; padding:18px}
.perf-detail .label{font-size:10.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--lavender-deep)}
.perf-detail h2{font-size:20px; line-height:1.2; margin:7px 0 2px}

.perf-detail-status{display:flex; align-items:center; gap:8px; margin:14px 0 16px}
.perf-detail-status .tsub{font-size:11.5px}

.perf-scoreline span{font-size:12px; color:var(--muted); padding-bottom:3px}
.perf-detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; margin-top:15px}
.perf-detail-grid .k{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
.perf-detail-grid .v{font-size:13px; font-weight:500; margin-top:2px}
.perf-benchmark-box{background:rgba(255,255,255,.75); border:1px solid rgba(109,63,213,.13); border-radius:6px; padding:11px 12px; margin-top:16px}

.perf-insight.positive{border-left:3px solid var(--onplan)}
.perf-insight.priority{border-left:3px solid var(--behind)}
.perf-insight h3{font-size:14px; margin:0 0 5px}
.perf-insight p{font-size:13px; color:var(--muted); line-height:1.5; margin:0}
.perf-insight .eyebrow{font-size:10.5px; font-weight:600; color:var(--faint); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px}
.perf-context{display:flex; align-items:flex-start; gap:10px; background:#FAF9FF; border:1px solid rgba(109,63,213,.13);
  border-radius:6px; padding:11px 13px; font-size:12px; color:var(--muted); line-height:1.45}
.perf-context .mark{flex:0 0 auto; color:var(--cyan); font-size:15px; line-height:1}

P Package Billable Pacing Rate","pct":100.0},{"field":"First Party Impressions","pct":100.0},{"field":"First Party CTR","pct":100.0},{"field":"Onsite Ad Engagement Rate","pct":100.0},{"field":"Social_Total Engagements/Actions Rate","pct":100.0},{"field":"Account Management Team","pct":97.9},{"field":"Attention Unit Score","pct":60.6},{"field":"Third Party Impressions","pct":32.9},{"field":"Third Party CTR","pct":32.5},{"field":"Video_Completion Rate","pct":30.6},{"field":"Google Analytics Pageviews","pct":8.3}],"phTabs":[{"tab":"End Date Discrepancies","rows":11},{"tab":"Third Party Reports Needed","rows":0},{"tab":"Delayed Launches - Paid Social","rows":6},{"tab":"Delayed Launches - Onsite","rows":1},{"tab":"Overall Pacing","rows":113},{"tab":"Package Pacing Below 100","rows":2},{"tab":"Lines Pacing Below 100 - Direct","rows":12},{"tab":"Lines Pacing Above 120 - Direct","rows":12},{"tab":"Lines Pacing Below 100 - Social","rows":24},{"tab":"Lines Pacing Above 120 - Social","rows":3},{"tab":"Orders Starting Next 7 Days","rows":2},{"tab":"Lines Starting This Week Onsite","rows":33},{"tab":"Lines Starting This Week Spon","rows":6},{"tab":"Lines Starting This Week Social","rows":4},{"tab":"Performance","rows":294}],"placeholderShare":14.0,"nonadservedShare":26,"overNoise":{"withPlaceholder":25,"withoutPlaceholder":15},"thresholds":{"goalFloor":1000,"launchGrace":5,"launchFraction":0.05,"gapBand":0.1}}</script>
<script>
const D = JSON.parse(document.getElementById('payload').textContent);
D.alerts.forEach(a=>{ if(a.rule) a.rule=a.rule.replace(/vertical owner/gi,'Pod owner'); });

/* ---------- formatting ---------- */
const nf = n => n===null||n===undefined||isNaN(n) ? '—' : Math.round(n).toLocaleString('en-US');
function compact(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  const a=Math.abs(n);
  if(a>=1e9) return (n/1e9).toFixed(1).replace(/\.0$/,'')+'B';
  if(a>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  if(a>=1e3) return (n/1e3).toFixed(0)+'K';
  return String(Math.round(n));
}
const money = n => n===null||n===undefined||isNaN(n) ? '—' : '$'+compact(n);
const riskTxt = r => (r.risk===null||r.risk===undefined) ? '—'
  : (r.riskEst
      ? `<span title="Estimated at the portfolio CPM — this order carries no booked value in its name">~${money(r.risk)}</span>`
      : money(r.risk));
const pct  = (n,d=0) => n===null||n===undefined||isNaN(n) ? '—' : (n*100).toFixed(d)+'%';
const signed = n => {
  if(n===null||n===undefined||isNaN(n)) return '—';
  const p = Math.round(n*100);
  return (p>0?'+':'') + p + ' pts';
};
const ctrTxt = n => n===null||n===undefined||isNaN(n) ? '—' : (n*100).toFixed(2)+'%';
const esc = s => String(s===null||s===undefined?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const STATE_LABEL = {behind:'Behind', ahead:'Over', onplan:'On plan',
                     notlive:'Not delivering', upcoming:'Upcoming', ended:'Ended'};

function stat(k,v,n,cls){
  return `<div class="card stat"><div class="k">${esc(k)}</div>
    <div class="v ${cls||''}">${v}</div><div class="n">${esc(n||'')}</div></div>`;
}

/* ---------- rail footer ---------- */
document.getElementById('railfoot').innerHTML =
  D.sources.map(s=>`<div style="margin-bottom:10px">${esc(s.name)}<br>
    <span style="color:var(--faint)">${esc(s.asOf)} · ${nf(s.rows)} rows</span></div>`).join('') +
  `<div style="color:var(--faint)">Prototype on live extracts. Every number on screen is computed
   from the two files, not sample data.</div>`;

/* ================= TODAY ================= */
function renderToday(){
  const t = D.totals;
  const bars = D.strip.map(p=>{
    const h = Math.min(Math.abs(p.gap)/0.5,1)*100;
    const cls = p.state;
    return `<div class="col"><div class="up">${p.gap>0?`<div class="bar ${cls}" style="height:${h}%"></div>`:''}</div>
      <div class="dn">${p.gap<=0?`<div class="bar ${cls}" style="height:${h}%"></div>`:''}</div></div>`;
  }).join('');

  const groups = ['Launch','Pacing','Data quality','Commercial'];
  const ledger = groups.map(g=>{
    const items = D.alerts.filter(a=>a.group===g);
    if(!items.length) return '';
    return `<div class="groupbar"><h3>${esc(g)}</h3><div class="line"></div></div>
      <div class="ledger">` + items.map(a=>{
        const clear = a.count===0;
        return `<div class="alert ${clear?'clear':a.severity}">
          <div class="cnt">${clear?'clear':nf(a.count)}<small>${clear?'nothing to action':esc(a.unit)}</small></div>
          <div class="body"><div class="name">${esc(a.label)}</div>
            <div class="rule">${esc(a.rule)}</div>
            ${a.fieldGap?`<div class="flag">Field gap: ${esc(a.fieldGap)}</div>`:''}
          </div></div>`;
      }).join('') + `</div>`;
  }).join('');

  const rows = D.worklist.slice(0,14).map(r=>`
    <tr>
      <td><div class="tname">${esc(r.advertiser)}</div>
          <div class="tsub">${esc(r.package)} · order ${r.order}</div></td>
      <td>${esc(r.am)}<div class="tsub">${esc(r.team)}</div></td>
      <td>${miniBar(r)}</td>
      <td class="r">${signed(r.gap)}</td>
      <td class="r">${compact(r.shortfall)}</td>
      <td class="r">${riskTxt(r)}</td>
      <td class="r">${r.daysLeft}d</td>
      <td><span class="pill ${r.state}">${STATE_LABEL[r.state]}</span></td>
    </tr>`).join('');

  document.getElementById('view-today').innerHTML = `
    <h1>Today</h1>
    <p class="lede">One screen an account manager can open at 9am and know what to touch.
      Packages are ranked by what the shortfall is worth, not by how far off plan they read.</p>
    <p class="stamp">Delivery as of <b>${esc(D.asOf)}</b> · ${nf(t.live)} live packages across
      ${t.teams} Pods and ${t.ams} account managers · pacing compares delivered share of goal
      with elapsed share of flight</p>

    <div class="grid g4">
      ${stat('Not delivering', nf(t.notlive), 'live, effectively dark', 'behind')}
      ${stat('Behind plan', nf(t.behind), `of ${nf(t.live)} live packages`, 'behind')}
      ${stat('Over-delivering', nf(t.ahead), 'inventory going out unpaid', 'ahead')}
      ${stat('Value at risk', money(t.risk), `${t.valueCoverage}% of packages priced`)}
    </div>

    <div class="note" style="margin-top:14px">
      <b>The book as a whole is on plan, which is exactly why the total cannot be the headline.</b>
      Delivery across all ${nf(t.live)} live packages sits at ${pct(t.pacingIndex,1)} of where the
      calendar says it should be. Underneath it, ${t.notlive} packages are dark and ${t.behind}
      are more than ten points behind, carrying ${money(t.risk)} between them.
    </div>

    <div class="sec">
      <header><h2>The shape of the book</h2>
        <p>Every live package, sorted by how far delivery sits from where the calendar says it
          should be. The width of the red tail is the workload; a package sitting on the centre
          line needs nothing.</p></header>
      <div class="card">
        <div class="striphead">
          <div class="legend">
            <span><i class="dot" style="background:var(--behind)"></i>Behind by more than 10 points</span>
            <span><i class="dot" style="background:#C7EFE8"></i>Within 10 points</span>
            <span><i class="dot" style="background:var(--ahead)"></i>Over by more than 10 points</span>
            <span><i class="dot" style="background:var(--blocked)"></i>Live, no delivery</span>
          </div>
        </div>
        <div class="strip" role="img"
          aria-label="Distribution of pacing gap across ${nf(t.live)} live packages">${bars}</div>
        <div class="stripaxis"><span>furthest behind</span><span>on plan</span><span>furthest over</span></div>
      </div>
    </div>

    <div class="sec">
      <header><h2>Checks that ran this morning</h2>
        <p>The same checks the portfolio health workbook performs today, applied across all five
          Pods instead of one, with the rule that fired written next to each count.</p></header>
      ${ledger}
    </div>

    <div class="sec">
      <header><h2>Work the list</h2>
        <p>Ranked by value at risk. The marker on each bar is where delivery should be today.
          A tilde means the order carries no booked value in its name, so its shortfall is priced
          at the portfolio rate of $${D.totals.portfolioCpm.toFixed(2)} per thousand.</p></header>
      <div class="tablewrap"><table>
        <thead><tr><th>Advertiser and package</th><th>Owner</th><th>Delivered against plan</th>
          <th class="r">Gap</th><th class="r">Impr. short</th><th class="r">At risk</th>
          <th class="r">Left</th><th>State</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
    </div>`;
}

function miniBar(r){
  const d = Math.min(Math.max(r.deliveredPct||0,0),1.6);
  const e = Math.min(Math.max(r.expected||0,0),1);
  return `<div class="mini" title="delivered ${pct(r.deliveredPct,1)} · expected ${pct(r.expected,1)}">
      <div class="fill ${r.state}" style="width:${(d/1.6*100).toFixed(1)}%"></div>
      <div class="tick" style="left:${(e/1.6*100).toFixed(1)}%"></div>
    </div>`;
}

/* ================= PACING ================= */
let pacingFilter = 'all';
function renderPacing(){
  const teams = ['all', ...D.teams.map(t=>t.team)];
  const chips = teams.map(t=>
    `<button data-team="${esc(t)}" aria-pressed="${t===pacingFilter}">${t==='all'?'All Pods':esc(t)}</button>`
  ).join('');

  const rows = D.worklist
    .filter(r=>pacingFilter==='all'||r.team===pacingFilter)
    .map(r=>`
    <tr>
      <td><div class="tname">${esc(r.advertiser)}</div>
          <div class="tsub">${esc(r.package)} · ${r.lines} line${r.lines===1?'':'s'}</div></td>
      <td>${esc(r.am)}</td>
      <td class="tsub">${esc(r.start)} – ${esc(r.end)}</td>
      <td>${miniBar(r)}</td>
      <td class="r">${pct(r.deliveredPct,1)}</td>
      <td class="r">${pct(r.expected,1)}</td>
      <td class="r" style="color:var(--behind);font-weight:500">${signed(r.gap)}</td>
      <td class="r">${compact(r.goal)}</td>
      <td class="r">${r.daysLeft}d</td>
      <td><span class="pill ${r.state}">${STATE_LABEL[r.state]}</span></td>
    </tr>`).join('') || `<tr><td colspan="10" style="color:var(--faint)">No packages behind plan in this Pod.</td></tr>`;

  const over = D.overlist.map(r=>`
    <tr>
      <td><div class="tname">${esc(r.advertiser)}</div><div class="tsub">${esc(r.package)}</div></td>
      <td>${esc(r.am)}<div class="tsub">${esc(r.team)}</div></td>
      <td>${miniBar(r)}</td>
      <td class="r">${pct(r.deliveredPct,1)}</td>
      <td class="r" style="color:var(--ahead);font-weight:500">${signed(r.gap)}</td>
      <td class="r" style="font-weight:500">${compact(r.imprOver)}</td>
      <td class="r">${money(r.value)}</td>
      <td class="r">${r.daysLeft}d</td>
    </tr>`).join('');

  document.getElementById('view-pacing').innerHTML = `
    <h1>Pacing</h1>
    <p class="lede">Package-level planned against delivered, with the line items that roll into it.
      This is the view the roadmap scopes for GAM; it is built here on the Meta and onsite data
      already flowing.</p>
    <p class="stamp">Grain: order → package → ad → line item · ${nf(D.totals.packages)} packages
      from ${nf(D.totals.orders)} orders · goal source <b>AP Package Impression Goals</b>,
      delivery source <b>AP Package Total Billable Impressions</b></p>

    <div class="note">
      <b>Why this replaces the below-100 and above-120 cuts.</b> A quarter of all lines currently
      trip the over-120 alert, but ${D.placeholderShare}% of lines are booked with an impression
      goal of 1 — sponsorship and flat-rate placements whose pacing rate is arithmetic noise.
      Excluding them drops genuine over-pacing from ${D.overNoise.withPlaceholder}% to
      ${D.overNoise.withoutPlaceholder}% of lines. Comparing delivery against elapsed flight
      instead of against a raw goal removes the rest of the false positives.
    </div>

    <div class="sec">
      <header><h2>Behind plan and not delivering</h2>
        <p>Packages trailing the calendar by more than ten points, plus flights that are live but
          effectively dark. Ranked by what the shortfall is worth.</p></header>
      <div class="filters" id="pacingFilters">${chips}</div>
      <div class="tablewrap"><table>
        <thead><tr><th>Advertiser and package</th><th>Owner</th><th>Flight</th>
          <th>Delivered against plan</th><th class="r">Delivered</th><th class="r">Expected</th>
          <th class="r">Gap</th><th class="r">Goal</th><th class="r">Left</th>
          <th>State</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
    </div>

    <div class="sec">
      <header><h2>Over-delivering</h2>
        <p>Ahead of plan by more than ten points. Every impression above the line is inventory
          delivered without revenue against it, and a candidate for an upsell conversation
          rather than a correction. Ranked by impressions already given away rather than by
          percentage, so small packages do not crowd out real ones.</p></header>
      <div class="tablewrap"><table>
        <thead><tr><th>Advertiser and package</th><th>Owner</th><th>Delivered against plan</th>
          <th class="r">Delivered</th><th class="r">Gap</th><th class="r">Impr. ahead</th>
          <th class="r">Package value</th><th class="r">Left</th></tr></thead>
        <tbody>${over}</tbody></table></div>
    </div>`;

  document.getElementById('pacingFilters').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    pacingFilter = b.dataset.team; renderPacing();
  });
}

/* ================= CREATIVE ================= */
function renderCreative(){
  const lo0 = Math.min(...D.families.map(f=>f.lo)) * 0.7;
  const hi0 = Math.max(...D.families.map(f=>f.hi)) * 1.15;
  const L = Math.log(lo0), R = Math.log(hi0);
  const fam = D.families.map(f=>{
    const w = x => (((Math.log(Math.max(x,lo0)) - L) / (R - L)) * 100).toFixed(1);
    return `<tr>
      <td class="tname">${esc(f.family)}</td>
      <td class="r">${nf(f.lines)}</td>
      <td class="r">${compact(f.impressions)}</td>
      <td><div class="band" title="range ${ctrTxt(f.lo)} to ${ctrTxt(f.hi)}">
            <div class="track"></div>
            <div class="zone" style="left:${w(f.lo)}%; width:${(w(f.hi)-w(f.lo)).toFixed(1)}%"></div>
            <div class="med" style="left:${w(f.median)}%"></div>
          </div></td>
      <td class="r">${ctrTxt(f.lo)}–${ctrTxt(f.hi)}</td>
      <td class="r">${ctrTxt(f.median)}</td>
      <td class="r">${f.attention===null?'—':f.attention.toFixed(1)}</td>
      <td class="r"><span style="color:var(--onplan)">${f.above}</span> /
        <span style="color:var(--muted)">${f.within}</span> /
        <span style="color:var(--behind)">${f.below}</span></td>
    </tr>`;
  }).join('');

  const creRow = (r,kind) => {
    const lo=r.lo, hi=r.hi, top=Math.max(hi*1.6, r.ctr*1.1);
    const w = x => (Math.min(x,top)/top*100).toFixed(1);
    return `<tr>
      <td><div class="tname">${esc(r.advertiser)}</div>
          <div class="tsub">${esc(r.ad)}</div></td>
      <td>${esc(r.family)}${r.brands.length?`<div class="tsub">${esc(r.brands.join(', '))}</div>`:''}</td>
      <td class="r">${compact(r.impressions)}</td>
      <td><div class="band">
            <div class="track"></div>
            <div class="zone" style="left:${w(lo)}%; width:${(w(hi)-w(lo)).toFixed(1)}%"></div>
            <div class="act ${kind}" style="left:${w(r.ctr)}%"></div>
          </div></td>
      <td class="r" style="font-weight:500">${ctrTxt(r.ctr)}</td>
      <td><span class="pill ${kind}">${kind==='above'?'Above range':'Below range'}</span></td>
      <td>${esc(r.am)}</td>
    </tr>`;
  };

  document.getElementById('view-creative').innerHTML = `
    <h1>Creative</h1>
    <p class="lede">Ranking creative needs something to rank against. Each format family carries
      its own click-through range, so a branded content unit is judged against branded content
      and not against a run-of-site banner.</p>
    <p class="stamp">Ranges are the middle half of live delivery within each family, on lines with
      1,000 impressions or more · format family is parsed from <b>AP Ad Name</b> and publisher
      brand from the <b>Line Item</b> string — neither is a governed field today</p>

    <div class="sec">
      <header><h2>What each family delivers</h2>
        <p>The shaded band is the middle half of performance; the marker is the family median.
          Attention unit score is shown where it is populated. The axis is logarithmic, because

/* ================= PERFORMANCE ================= */
let perfSort = 'impact';
let perfSelectedKey = '';

function renderPerformance(){
  const rangeStats = D.families.reduce((a,f)=>{
    a.below += f.below||0; a.within += f.within||0; a.above += f.above||0; return a;
  }, {below:0, within:0, above:0});
  const rangeTotal = rangeStats.below + rangeStats.within + rangeStats.above;
  const withinShare = rangeTotal ? Math.round(rangeStats.within/rangeTotal*100) : 0;
  const cov = field => (D.coverage.find(c=>c.field===field)||{}).pct||0;
  const shortAd = r => r.ad.length>58 ? r.ad.slice(0,58)+'…' : r.ad;
  const keyFor = r => `${r.kind}:${r.advertiser}:${r.ad}`;
  const metricsFor = r => {
    const impressions = Number(r.impressions)||0;
    const clicks = Math.round(impressions * (Number(r.ctr)||0));
    const boundary = r.kind==='above' ? r.hi : r.lo;
    const impactClicks = Math.round(impressions * ((Number(r.ctr)||0) - boundary));
    return {impressions, clicks, impactClicks};
  };
  const queue = [
    ...D.bottomCreative.slice(0,3).map(r=>({...r,kind:'below',status:'Below range',action:'Open creative review'})),
    ...D.topCreative.slice(0,3).map(r=>({...r,kind:'above',status:'Above range',action:'Use as renewal proof'}))
  ];
  const sortLabels = {
    impact:'Performance impact', impressions:'Impressions', clicks:'Clicks', ctr:'CTR', gap:'Benchmark gap'
  };
  const sortedQueue = [...queue].sort((a,b)=>{
    const am=metricsFor(a), bm=metricsFor(b);
    if(perfSort==='impressions') return bm.impressions-am.impressions;
    if(perfSort==='clicks') return bm.clicks-am.clicks;
    if(perfSort==='ctr') return (b.ctr||0)-(a.ctr||0);
    if(perfSort==='gap') return Math.abs(b.ctr-(b.kind==='above'?b.hi:b.lo))-Math.abs(a.ctr-(a.kind==='above'?a.hi:a.lo));
    return Math.abs(bm.impactClicks)-Math.abs(am.impactClicks);
  });
  const selected = sortedQueue.find(r=>keyFor(r)===perfSelectedKey) || sortedQueue[0];
  perfSelectedKey = selected ? keyFor(selected) : '';
  const proof = D.topCreative[0];
  const selectedMetrics = metricsFor(selected);
  const selectedRange = `${ctrTxt(selected.lo)}–${ctrTxt(selected.hi)}`;
  const selectedImpact = selectedMetrics.impactClicks;
  const impactText = selectedImpact===0 ? 'At benchmark boundary' :
    `${selectedImpact>0?'+':''}${compact(selectedImpact)} clicks vs ${selected.kind==='above'?'ceiling':'floor'}`;

  const summaryStat = (k,v,n,cls) => `<div class="card stat">
    <div class="k">${esc(k)}</div><div class="v ${cls||''}">${v}</div>
    <div class="n">${esc(n||'')}</div></div>`;
  const detailMetric = (k,v,n,missing=false) => `<div class="perf-detail-metric">
    <div class="k">${esc(k)}</div><div class="v ${missing?'missing':''}">${v}</div>
    <div class="n">${esc(n||'')}</div></div>`;
  const ownerBlock = r => `<div class="perf-owner">
    <div class="perf-owner-line"><span class="perf-owner-role am">AM</span>${esc(r.am)}</div>
    <div class="perf-owner-line"><span class="perf-owner-role cm">CM</span>Campaign Management</div>
  </div>`;
  const watchRows = sortedQueue.map(r=>{
    const m = metricsFor(r);
    const rowKey = keyFor(r);
    return `<tr tabindex="0" data-perf-key="${esc(rowKey)}" aria-selected="${rowKey===perfSelectedKey}">
      <td><div class="tname">${esc(r.advertiser)}</div><div class="tsub">${esc(shortAd(r))}</div>
        <div class="tsub">${esc(r.family)}${r.brands && r.brands.length?' · '+r.brands.join(', '):''}</div></td>
      <td><span class="perf-kpi-label">CTR</span><div class="perf-result ${r.kind}">${ctrTxt(r.ctr)}</div>
        <div class="perf-benchmark">${ctrTxt(r.lo)}–${ctrTxt(r.hi)}</div></td>
      <td><div class="perf-support"><div class="perf-support-line"><b>Impr.</b><span>${compact(m.impressions)}</span></div>
        <div class="perf-support-line"><b>Clicks</b><span>${compact(m.clicks)}</span></div>
        <div class="perf-support-line"><b>Impact</b><span>${m.impactClicks>0?'+':''}${compact(m.impactClicks)}</span></div></div></td>
      <td><div class="perf-delivery missing">Package grain</div><div class="perf-delivery-note">${cov('AP Package Billable Pacing Rate').toFixed(0)}% source coverage · open Pacing</div></td>
      <td>${ownerBlock(r)}</td>
      <td><span class="pill ${r.kind}">${esc(r.status)}</span></td>
      <td><div class="perf-action-text">${esc(r.action)}</div></td>
    </tr>`;
  }).join('');

  document.getElementById('view-performance').innerHTML = `
    <h1>Performance</h1>
    <p class="lede">Give account managers and sellers a clear answer: what happened, is it within
      expectation, who owns the next move, and what evidence supports the KPI?</p>
    <p class="stamp">Portfolio performance · ${nf(rangeTotal)} comparable lines · current extract through
      <b>${esc(D.asOf)}</b> · ranges shown are directional guidance, not campaign-specific targets</p>

    <div class="perf-controls">
      <div class="perf-control"><span class="label">View</span><span class="value">AM + CM action queue</span></div>
      <div class="perf-control"><span class="label">Pod</span><span class="value">All Pods</span></div>
      <div class="perf-control"><span class="label">Product</span><span class="value">All products</span></div>
      <div class="perf-control"><span class="label">Primary KPI</span><span class="value">All KPIs</span></div>
      <label class="perf-control perf-sort-control"><span class="label">Sort by</span>
        <select id="perfSort" aria-label="Sort performance queue">
          ${Object.entries(sortLabels).map(([value,label])=>`<option value="${value}" ${value===perfSort?'selected':''}>${label}</option>`).join('')}
        </select>
      </label>
      <div class="perf-refresh">Updated ${esc(D.asOf)} · source freshness visible in every report</div>
    </div>

    <div class="perf-summary-grid">
      ${summaryStat('Campaigns evaluated', nf(D.phTabs.find(t=>t.tab==='Performance')?.rows||rangeTotal), 'Performance source rows')}
      ${summaryStat('Within benchmark', `${withinShare}%`, `${nf(rangeStats.within)} of ${nf(rangeTotal)} comparable lines`)}
      ${summaryStat('Below range', nf(rangeStats.below), 'Open an optimization conversation', 'behind')}
      ${summaryStat('Above range', nf(rangeStats.above), 'Proof points for renewal and upsell', 'ahead')}
    </div>

    <div class="sec">
      <div class="perf-workspace">
        <div class="perf-panel">
          <div class="perf-panel-head">
            <div><h2>Performance action queue</h2>
              <p>Sort by impact or supporting volume to surface the biggest drivers, then route the next move to the AM and CM.</p></div>
            <span class="perf-viewtag">${sortedQueue.length} rows · ${esc(sortLabels[perfSort])}</span>
          </div>
          <div class="tablewrap"><table class="perf-table-screen">
            <thead><tr><th>Advertiser / creative</th><th>Primary KPI</th><th>Supporting numbers</th>
              <th>Delivery</th><th>Owner</th><th>Status</th><th>Next move</th></tr></thead>
            <tbody>${watchRows}</tbody>
          </table></div>
        </div>

        <aside class="perf-detail">
          <div class="label">Selected account · action needed</div>
          <h2>${esc(selected.advertiser)}</h2>
          <div class="sub">${esc(selected.family)} · ${esc(selected.am)} · ${compact(selected.impressions)} impressions</div>
          <div class="perf-detail-status"><span class="pill ${selected.kind}">${esc(selected.status)}</span><span class="tsub">${selected.kind==='above'?'Seller proof point':'Creative review candidate'}</span></div>
          <div class="perf-scoreline"><strong class="${selected.kind}">${ctrTxt(selected.ctr)}</strong><span>CTR · primary KPI</span></div>
          <div class="perf-detail-metrics">
            ${detailMetric('Impressions', compact(selectedMetrics.impressions), 'First-party')}
            ${detailMetric('Clicks', compact(selectedMetrics.clicks), 'Calculated from CTR')}
            ${detailMetric('Spend / cost', 'Not joined', 'Needs cost source', true)}
            ${detailMetric('Delivery', 'Package grain', `${cov('AP Package Billable Pacing Rate').toFixed(0)}% coverage`, true)}
            ${detailMetric('Impact vs band', impactText, 'Derived from benchmark', selectedImpact===0)}
            ${detailMetric('Booked value', 'See Book', 'Order-level metric', true)}
          </div>
          <div class="perf-impact"><strong>Supporting evidence:</strong> ${compact(selectedMetrics.clicks)} clicks from
            ${compact(selectedMetrics.impressions)} impressions · ${impactText.toLowerCase()}.</div>
          <div class="perf-detail-grid">
            <div><div class="k">Benchmark</div><div class="v">${selectedRange}</div></div>
            <div><div class="k">Campaign goal</div><div class="v">Campaign-specific</div></div>
            <div><div class="k">Secondary signal</div><div class="v">ER / Attention*</div></div>
            <div><div class="k">AM / CM owner</div><div class="v">${esc(selected.am)} / Campaign Management</div></div>
          </div>
          <div class="perf-benchmark-box"><div class="label">${selected.kind==='above'?'Why this is useful':'Why this is flagged'}</div>
            <div class="range">${selectedRange} expected</div>
            <p>${selected.kind==='above'
              ? `Current result is above the internal ${esc(selected.family)} comparison band; use it as a proof point in renewal and upsell conversations.`
              : `Current result is below the internal ${esc(selected.family)} comparison band; use the campaign brief to confirm the intended objective.`}</p>
          </div>
          <div class="perf-next"><h3>Suggested next move</h3>
            <ul>${selected.kind==='above'
              ? `<li>Capture the result as seller-ready renewal proof.</li>
                 <li>Identify the creative, placement, and audience choices to replicate.</li>
                 <li>Share the learning with the AM and Campaign Management.</li>`
              : `<li>Review creative with Campaign Management.</li>
                 <li>Partner with HearstMade on load time, messaging, and design.</li>
                 <li>Check flight left, budget flexibility, and mid-flight creative options.</li>`}</ul>
          </div>
          <div class="perf-tags"><span class="perf-tag">Draft AM follow-up</span><span class="perf-tag">Document client learning</span></div>
          <div class="perf-data-note"><span class="mark">✦</span><div>Numbers are shown at their available grain: clicks and impressions are creative-level; delivery and booked value are package/order-level; spend is not yet in this extract.</div></div>
        </aside>
      </div>
    </div>

    <div class="sec">
      <header><h2>Make the result useful in the account conversation</h2>
        <p>The dashboard should turn the metric into a clear sales or account-management narrative.</p></header>
      <div class="perf-insight-grid">
        <div class="perf-insight positive"><div class="eyebrow">Seller-ready proof point</div>
          <h3>${esc(proof.advertiser)} is outperforming its comparison band</h3>
          <p>${esc(proof.family)} is at ${ctrTxt(proof.ctr)} against ${ctrTxt(proof.lo)}–${ctrTxt(proof.hi)} on
            ${compact(proof.impressions)} impressions. Use this as evidence of what is working and as a renewal conversation starter.</p></div>
        <div class="perf-insight priority"><div class="eyebrow">AM priority</div>
          <h3>Below range should trigger an action, not a failure label</h3>
          <p>Start with creative, targeting, and placement context. If the campaign is complete, document the intervention and add Attention, IAS, or Audience Insights where available.</p></div>
      </div>
    </div>

    <div class="sec">
      <header><h2>What can be shown today</h2>
        <p>Metric coverage stays visible so users know which signals are ready for a client-facing headline and which are still being joined.</p></header>
      <div class="grid g3">
        ${summaryStat('CTR', 'Ready', `${cov('First Party CTR').toFixed(0)}% field coverage`)}
        ${summaryStat('VCR', 'Partial', `${cov('Video_Completion Rate').toFixed(1)}% field coverage`, 'ahead')}
        ${summaryStat('GA4 pageviews', 'Next', `${cov('Google Analytics Pageviews').toFixed(1)}% field coverage`, 'behind')}
      </div>
    </div>

    <div class="sec">
      <div class="perf-context"><span class="mark">✦</span><div><b>Benchmark context:</b> ranges represent the middle 50% of results (25th–75th percentile) with outliers removed. The supplied guidance covers Q4 2024–Q1 2025, with directional insights labeled Q3–Q4 2025. Branded Content and Shopper Solutions ranges are still forthcoming, so this mockup labels the current Branded Content band as an internal comparison proxy.</div></div>
    </div>`;

  const sortSelect = document.getElementById('perfSort');
  if(sortSelect) sortSelect.addEventListener('change', e=>{ perfSort=e.target.value; renderPerformance(); });
  document.querySelectorAll('[data-perf-key]').forEach(row=>{
    const choose = () => { perfSelectedKey=row.dataset.perfKey; renderPerformance(); };
    row.addEventListener('click', choose);
    row.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); choose(); } });
  });
}

  const rows = REPORTS.map(r=>`
    <tr>
      <td><div class="tname">${esc(r.name)}</div>
          <div class="tsub" style="margin-top:3px;max-width:46ch;line-height:1.45">${esc(r.body)}</div></td>
      <td>${esc(r.who)}</td>
      <td class="tsub">${esc(r.when)}</td>
      <td class="tsub">${esc(r.how)}</td>
      <td class="tsub" style="max-width:26ch;line-height:1.45">${esc(r.replaces)}</td>
    </tr>`).join('');

  const top = D.worklist[0], t2 = D.worklist[1];
  const over = D.overlist[0];
  const bad = D.bottomCreative[0];

  document.getElementById('view-reports').innerHTML = `
    <h1>Reports</h1>
    <p class="lede">A dashboard nobody opens changes nothing. Each view above has a push
      counterpart that arrives before the decision, addressed to one role, carrying only what
      that role can act on.</p>
    <p class="stamp">Seven scheduled outputs replace the fourteen-tab workbook and the weekly
      pacing export · every one is generated from the same governed tables behind the dashboards</p>

    <div class="sec">
      <header><h2>What gets sent</h2></header>
      <div class="tablewrap"><table>
        <thead><tr><th>Report</th><th>Who it is for</th><th>When</th><th>How</th>
          <th>What it replaces</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
    </div>

    <div class="sec">
      <header><h2>The daily digest, rendered</h2>
        <p>Built from this morning\u2019s numbers for one manager, to show the shape and the length.
          Four items, one screen, nothing to download.</p></header>
      <div class="email">
        <div class="hd">
          <div class="subj">Delivery: 2 packages need a decision today</div>
          <div class="meta">Insights Hub → ${esc(top.am)} · ${esc(D.asOf)}, 7:00am ·
            ${esc(top.team)}</div>
        </div>
        <div class="bd">
          <p>Two packages on your book are far enough behind that they will not recover on their
            current daily rate.</p>
          <ul>
            <li><b>${esc(top.advertiser)}</b> — ${esc(top.package)} is ${signed(top.gap)} behind
              with ${top.daysLeft} days left. Delivering ${pct(top.deliveredPct,0)} of goal against
              ${pct(top.expected,0)} expected; ${compact(top.shortfall)} impressions short,
              ${money(top.risk)} at risk.</li>
            <li><b>${esc(t2.advertiser)}</b> — ${esc(t2.package)} is ${signed(t2.gap)} behind,
              ${compact(t2.shortfall)} short, ${money(t2.risk)} at risk.</li>
          </ul>
          <p>One worth a call the other way:</p>
          <ul>
            <li><b>${esc(over.advertiser)}</b> is ${signed(over.gap)} ahead of plan.
              ${compact(over.imprOver)} impressions have gone out ahead of contract on a
              ${money(over.value)} package — a reason to open the renewal conversation now rather
              than to throttle.</li>
          </ul>
          <p>And one creative to swap while there is still flight left:</p>
          <ul>
            <li><b>${esc(bad.advertiser)}</b> — ${esc(bad.family)} at ${ctrTxt(bad.ctr)} against a
              family range of ${ctrTxt(bad.lo)} to ${ctrTxt(bad.hi)}, on
              ${compact(bad.impressions)} impressions.</li>
          </ul>
          <p style="color:var(--faint);font-size:12.5px;margin:0">
            Delivery through ${esc(D.asOf)}. Pacing compares delivered share of goal with elapsed
            share of flight. Open the package · Snooze a check · Tell us this fired wrongly</p>
        </div>
      </div>
    </div>

    <div class="sec">
      <header><h2>Rules the reports run on</h2></header>
      <div class="grid g2">
        <div class="card">
          <h3>One owner per message</h3>
          <p style="font-size:13.5px;color:var(--muted);margin:0;line-height:1.55">
            Every alert resolves to a single named account manager before it is sent. A check that
            cannot be attributed goes to an operations queue, not to everyone. Thirteen rows in the
            current extract carry no account management team, and that is where the queue
            starts.</p>
        </div>
        <div class="card">
          <h3>Silence is a feature</h3>
          <p style="font-size:13.5px;color:var(--muted);margin:0;line-height:1.55">
            A digest with nothing in it says so in one line. Checks that fire on more than a fifth
            of the book get their threshold reviewed rather than their volume tolerated — the
            over-120 rule is the current example.</p>
        </div>
        <div class="card">
          <h3>Every number carries its source</h3>
          <p style="font-size:13.5px;color:var(--muted);margin:0;line-height:1.55">
            Platform figures and internal figures are labelled separately wherever they appear, and
            a metric whose field is under half populated cannot be a headline. Freshness shows on
            the view, not in a footnote.</p>
        </div>
        <div class="card">
          <h3>Client-facing output is drafted, not sent</h3>
          <p style="font-size:13.5px;color:var(--muted);margin:0;line-height:1.55">
            The monthly summary and the wrap insert are generated and held for the account manager
            to edit. Automation writes the first draft and does the arithmetic; the manager keeps
            the client relationship.</p>
        </div>
      </div>
    </div>`;
}

/* ---------- nav ---------- */
const RENDER = {today:renderToday, pacing:renderPacing, creative:renderCreative,
                performance:renderPerformance,
                book:renderBook, reports:renderReports};
const done = {};
function show(v){
  if(!done[v]){ RENDER[v](); done[v]=true; }
  document.querySelectorAll('.view').forEach(s=>{ s.hidden = s.id !== 'view-'+v; });
  document.querySelectorAll('.nav button').forEach(b=>{
    b.setAttribute('aria-current', String(b.dataset.view===v));
  });
  window.scrollTo({top:0});
}
document.querySelector('.nav').addEventListener('click', e=>{
  const b = e.target.closest('button[data-view]'); if(b) show(b.dataset.view);
});
show('today');
</script>
</body>
</html>
